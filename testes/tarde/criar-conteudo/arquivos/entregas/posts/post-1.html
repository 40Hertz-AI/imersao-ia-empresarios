<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Torra Viva · post 1 · Clube</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Albert+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--marca:#234B3F;--destaque:#C23B22;--fundo:#F6F1EA;--texto:#2B1D14;--bourbon:#E8B547;--apoio:#6B5E55;--t:'Bricolage Grotesque',sans-serif;--c:'Albert Sans',sans-serif;--s:1}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#1d1d1d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;font-family:var(--c)}
.palco{width:1080px;height:1350px;zoom:var(--s)}
.lamina{width:1080px;height:1350px;position:relative;overflow:hidden;background:var(--fundo);color:var(--texto);padding:110px 96px 170px;display:flex;flex-direction:column}
.lamina[hidden]{display:none}
.lamina h2{font-family:var(--t);font-weight:800;font-size:96px;line-height:1.02;letter-spacing:-.025em}
.lamina p{font-size:40px;line-height:1.35}
.rodape{position:absolute;left:96px;right:96px;bottom:64px;display:flex;justify-content:space-between;align-items:center;font-size:28px;color:var(--apoio)}
.rodape .logo{font-family:var(--t);font-weight:800;font-size:34px;letter-spacing:-.02em;color:var(--texto)}
.rodape .arraste{display:flex;align-items:center;gap:12px}
.escura{background:var(--marca);color:var(--fundo)}
.escura .rodape,.escura .rodape .logo,.grao .rodape,.grao .rodape .logo,.cereja .rodape,.cereja .rodape .logo{color:var(--fundo)}
.grao{background:var(--texto);color:var(--fundo)}
.cereja{background:var(--destaque);color:var(--fundo)}
.etiqueta{align-self:flex-start;background:var(--bourbon);color:var(--texto);font:700 32px/1 var(--c);padding:18px 30px;border-radius:999px}
/* 1 gancho */
.gancho h2{font-size:118px;margin-top:auto;margin-bottom:auto}
/* 2-3 problema */
.problema h2{font-size:80px}
.problema p{margin-top:28px;max-width:820px}
.problema svg{margin-top:auto;align-self:center}
/* 4-5 metodo */
.metodo h2{font-size:80px}
.lista{list-style:none;padding:0;margin-top:auto;display:flex;flex-direction:column;gap:22px}
.lista li{display:flex;align-items:center;gap:36px;background:#fff;border:2px solid #E4DACB;border-radius:28px;padding:34px 40px;font:700 42px/1.2 var(--c)}
.lista svg{flex:none}
/* 6 virada */
.virada h2{font-size:88px}
.virada svg{margin-top:auto;align-self:flex-end}
/* 7 chamada */
.chamada{justify-content:center}
.chamada p{font-size:48px}
.chamada .palavra{font-family:var(--t);font-weight:800;font-size:300px;line-height:.9;letter-spacing:-.05em;margin:24px 0 40px}
.controles{display:flex;align-items:center;gap:16px;color:#eee;font:600 16px/1 var(--c)}
.controles button{font:inherit;width:44px;height:44px;border-radius:50%;border:1px solid #666;background:#2a2a2a;color:#fff;cursor:pointer}
.controles button:disabled{opacity:.3;cursor:default}
.controles button:focus-visible{outline:2px solid var(--bourbon);outline-offset:2px}
body.so{background:var(--fundo)} body.so .controles{display:none}
.unico h2{font-size:104px}
.unico .apoio{margin-top:32px;max-width:820px}
.unico .acao{align-self:flex-start;margin-top:auto;background:var(--destaque);color:var(--fundo);font:700 40px/1 var(--c);padding:28px 44px;border-radius:999px}
.bourbon{background:var(--bourbon);color:var(--texto)}
.bourbon .acao{background:var(--texto);color:var(--fundo)}
.escura .apoio{color:var(--fundo)}
.dia{color:var(--bourbon)}
</style></head><body>

<script>
// Uma lâmina por vez, do tamanho da janela. ?n=3 mostra só a lâmina 3, sem botões (relatório e print).
const n=+new URLSearchParams(location.search).get('n'), ls=[...document.querySelectorAll('.lamina')];
const [ant,prox]=document.querySelectorAll('.controles button'), conta=document.querySelector('.conta');
let i=Math.min(Math.max((n||1)-1,0),ls.length-1);
if(n) document.body.classList.add('so');
if(ls.length<2) document.querySelector('.controles').hidden=true;
function mostra(){ ls.forEach((l,k)=>l.hidden=k!==i); conta.textContent=(i+1)+' / '+ls.length; ant.disabled=i===0; prox.disabled=i===ls.length-1; }
function escala(){ const folga=n?0:80; document.documentElement.style.setProperty('--s',Math.min(1,innerWidth/1080,(innerHeight-folga)/1350)); }
ant.onclick=()=>{ if(i>0){i--;mostra();} }; prox.onclick=()=>{ if(i<ls.length-1){i++;mostra();} };
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') prox.click(); if(e.key==='ArrowLeft') ant.click(); });
addEventListener('resize',escala); escala(); mostra();
</script></body></html>
