<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E3A2B">
<title>Cartão fidelidade · Torra Viva</title>
<style>
  :root {
    --folha: #1E3A2B;
    --folha-escura: #152A1F;
    --kraft: #CDAA7D;
    --kraft-claro: #D9BC93;
    --cereja: #A8233A;
    --torra: #3B2416;
    --leite: #F3E6D0;
    --slab: "Rockwell", "Roboto Slab", "Zilla Slab", "Museo Slab", "Clarendon", "Courier New", serif;
    --texto: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--folha);
    color: var(--leite);
    font-family: var(--texto);
    font-size: 1rem;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }

  .topo {
    width: 100%;
    max-width: 440px;
    margin-bottom: 20px;
  }

  .marca {
    font-family: var(--slab);
    font-weight: 700;
    font-size: 1.125rem;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--kraft-claro);
  }

  .promessa {
    margin: 2px 0 0;
    font-size: 0.875rem;
    color: rgba(243, 230, 208, 0.72);
  }

  /* O cartão: etiqueta de papel kraft */
  .cartao {
    position: relative;
    width: 100%;
    max-width: 440px;
    background-color: var(--kraft);
    background-image:
      radial-gradient(rgba(59, 36, 22, 0.08) 1px, transparent 1.4px),
      radial-gradient(rgba(255, 255, 255, 0.10) 1px, transparent 1.6px);
    background-size: 7px 7px, 11px 11px;
    background-position: 0 0, 3px 5px;
    color: var(--torra);
    border-radius: 6px;
    padding: 28px 22px 22px;
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.55);
  }

  /* furo da etiqueta */
  .cartao::before {
    content: "";
    position: absolute;
    top: 14px;
    right: 18px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--folha);
    box-shadow: inset 0 0 0 3px var(--kraft-claro);
  }

  .titulo {
    font-family: var(--slab);
    font-weight: 700;
    font-size: clamp(1.75rem, 8vw, 2.25rem);
    line-height: 1.05;
    margin: 0 36px 10px 0;
  }

  .regra {
    margin: 0 0 22px;
    font-size: 0.9375rem;
    max-width: 34ch;
  }

  .carimbos {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }

  .carimbo {
    appearance: none;
    -webkit-appearance: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    width: 100%;
    aspect-ratio: 1;
    border: 0;
    padding: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    color: var(--torra);
    font: inherit;
  }

  /* espaço vazio: grão de café tracejado */
  .vazio {
    position: absolute;
    inset: 0;
    border: 2px dashed rgba(59, 36, 22, 0.45);
    border-radius: 50%;
    display: grid;
    place-items: center;
  }

  .vazio svg { width: 44%; height: auto; opacity: 0.45; }

  .carimbo:hover .vazio { border-color: rgba(59, 36, 22, 0.75); }
  .carimbo:hover .vazio svg { opacity: 0.7; }

  .carimbo:focus-visible {
    outline: 3px solid var(--folha);
    outline-offset: 3px;
  }

  /* tinta do carimbo */
  .tinta {
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 3px solid var(--cereja);
    color: var(--cereja);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transform: rotate(var(--giro, -8deg)) scale(1);
    opacity: 0;
    visibility: hidden;
    mix-blend-mode: multiply;
    -webkit-mask-image: radial-gradient(circle at 30% 70%, #000 55%, rgba(0,0,0,0.75) 75%, #000 90%);
            mask-image: radial-gradient(circle at 30% 70%, #000 55%, rgba(0,0,0,0.75) 75%, #000 90%);
  }

  .tinta::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid var(--cereja);
    border-radius: 50%;
  }

  .tinta b {
    font-family: var(--slab);
    font-size: clamp(0.95rem, 4.6vw, 1.2rem);
    font-weight: 700;
  }

  .tinta small {
    font-family: var(--slab);
    font-size: clamp(0.55rem, 2.4vw, 0.7rem);
    margin-top: 2px;
  }

  .carimbo[aria-pressed="true"] .vazio { visibility: hidden; }
  .carimbo[aria-pressed="true"] .tinta { opacity: 0.9; visibility: visible; }

  .carimbo.batendo .tinta { animation: bater 260ms cubic-bezier(.2,.9,.3,1.2); }

  @keyframes bater {
    0%   { opacity: 0; transform: rotate(var(--giro)) scale(1.5); }
    60%  { opacity: 1; transform: rotate(var(--giro)) scale(0.94); }
    100% { opacity: 0.9; transform: rotate(var(--giro)) scale(1); }
  }

  /* o 10º: o café por nossa conta */
  .premio .vazio {
    border: 2px solid var(--cereja);
    color: var(--cereja);
    background: rgba(168, 35, 58, 0.08);
  }

  .premio .vazio span {
    font-family: var(--slab);
    font-weight: 700;
    font-size: clamp(0.55rem, 2.5vw, 0.72rem);
    line-height: 1.1;
    text-align: center;
    padding: 0 4px;
  }

  .premio .tinta { background: var(--cereja); color: var(--leite); }
  .premio .tinta::before { border-color: var(--leite); }

  .status {
    margin: 22px 0 0;
    padding-top: 14px;
    border-top: 2px dashed rgba(59, 36, 22, 0.35);
    font-family: var(--slab);
    font-size: 1.125rem;
    font-weight: 700;
    min-height: 3.2em;
  }

  .status.ganhou { color: var(--cereja); }

  .rodape {
    width: 100%;
    max-width: 440px;
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    font-size: 0.8125rem;
    color: rgba(243, 230, 208, 0.7);
  }

  .rodape p { margin: 0; max-width: 32ch; }

  .zerar {
    flex-shrink: 0;
    background: transparent;
    color: var(--leite);
    border: 1px solid rgba(243, 230, 208, 0.5);
    border-radius: 4px;
    padding: 8px 12px;
    font: inherit;
    font-size: 0.875rem;
    cursor: pointer;
    min-height: 40px;
  }

  .zerar:hover { border-color: var(--leite); background: var(--folha-escura); }
  .zerar:focus-visible { outline: 3px solid var(--kraft-claro); outline-offset: 2px; }

  @media (max-width: 340px) {
    .carimbos { gap: 6px; }
    .cartao { padding: 24px 14px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .carimbo.batendo .tinta { animation: none; }
  }
</style>
</head>
<body>

<header class="topo">
  <p class="marca">Torra Viva Cafés Especiais</p>
  <p class="promessa">Torrado esta semana, na sua xícara na próxima.</p>
</header>

<main class="cartao">
  <h1 class="titulo">Seu cartão fidelidade</h1>
  <p class="regra">A cada café, um carimbo. Com 9 carimbos, o 10º café é por nossa conta.</p>

  <ul class="carimbos" id="carimbos"></ul>

  <p class="status" id="status" aria-live="polite"></p>
</main>

<footer class="rodape">
  <p>Toque num espaço para carimbar. Toque de novo para tirar o carimbo. Exemplo para aula: a Torra Viva é uma empresa fictícia.</p>
  <button type="button" class="zerar" id="zerar">Começar cartão novo</button>
</footer>

<script>
  var TOTAL = 10;
  var CHAVE = "torraviva-cartao-fidelidade";
  var giros = [-9, 6, -4, 11, -13, 3, -7, 9, -2, -6];

  var grao =
    '<svg viewBox="0 0 24 32" aria-hidden="true"><ellipse cx="12" cy="16" rx="10" ry="14" fill="none" stroke="currentColor" stroke-width="2"/>' +
    '<path d="M12 3c-4 6 4 11 0 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

  function carregar() {
    try {
      var salvo = JSON.parse(localStorage.getItem(CHAVE));
      if (Array.isArray(salvo) && salvo.length === TOTAL) return salvo;
    } catch (e) {}
    return new Array(TOTAL).fill(null);
  }

  function salvar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(datas)); } catch (e) {}
  }

  function hoje() {
    var d = new Date();
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0");
  }

  var datas = carregar();
  var lista = document.getElementById("carimbos");
  var aviso = document.getElementById("status");

  function desenhar() {
    lista.innerHTML = "";
    for (var i = 0; i < TOTAL; i++) {
      var premio = i === TOTAL - 1;
      var li = document.createElement("li");
      var b = document.createElement("button");
      b.type = "button";
      b.className = "carimbo" + (premio ? " premio" : "");
      b.dataset.i = i;
      b.style.setProperty("--giro", giros[i] + "deg");
      b.setAttribute("aria-pressed", datas[i] ? "true" : "false");
      b.setAttribute("aria-label",
        (premio ? "10º café, por nossa conta" : "Café " + (i + 1)) +
        (datas[i] ? ", carimbado em " + datas[i] : ", sem carimbo"));
      b.innerHTML =
        '<span class="vazio">' + (premio ? "<span>por nossa conta</span>" : grao) + "</span>" +
        '<span class="tinta" aria-hidden="true"><b>' + (premio ? "grátis" : "TV") + "</b><small>" + (datas[i] || "") + "</small></span>";
      li.appendChild(b);
      lista.appendChild(li);
    }
    atualizarStatus();
  }

  function atualizarStatus() {
    var pagos = datas.slice(0, TOTAL - 1).filter(Boolean).length;
    var faltam = (TOTAL - 1) - pagos;
    aviso.classList.remove("ganhou");
    if (datas[TOTAL - 1]) {
      aviso.textContent = "Café por nossa conta resgatado. Bom proveito!";
    } else if (faltam === 0) {
      aviso.textContent = "Cartão cheio! O próximo café é por nossa conta.";
      aviso.classList.add("ganhou");
    } else if (pagos === 0) {
      aviso.textContent = "Cartão novo. Peça seu café e ganhe o primeiro carimbo.";
    } else {
      aviso.textContent = "Falta" + (faltam > 1 ? "m " + faltam + " cafés" : " 1 café") + " para o seu por nossa conta.";
    }
  }

  lista.addEventListener("click", function (ev) {
    var b = ev.target.closest(".carimbo");
    if (!b) return;
    var i = Number(b.dataset.i);
    datas[i] = datas[i] ? null : hoje();
    salvar();
    desenhar();
    var novo = lista.querySelector('[data-i="' + i + '"]');
    novo.focus();
    if (datas[i]) {
      novo.classList.add("batendo");
      if (navigator.vibrate) navigator.vibrate(20);
    }
  });

  document.getElementById("zerar").addEventListener("click", function () {
    if (!datas.some(Boolean)) return;
    if (confirm("Tirar todos os carimbos e começar um cartão novo?")) {
      datas = new Array(TOTAL).fill(null);
      salvar();
      desenhar();
    }
  });

  desenhar();
</script>
</body>
</html>
