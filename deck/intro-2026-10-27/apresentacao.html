<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>IA para empresários · apresentação</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Modelo do player. build.sh copia para apresentacao/index.html, ao lado de slides/NN.jpg, videos/ e deck.js. -->
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
#palco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#slide{position:relative;width:1280px;height:720px;flex:none;transform-origin:center}
#slide img{width:100%;height:100%;display:block}
#slide video{position:absolute;background:#000;border-radius:14px;object-fit:contain;cursor:pointer}
#play{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;border:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:40px;cursor:pointer}
#play[hidden]{display:none}
#n{position:fixed;right:12px;bottom:8px;color:#5A5A5A;font-size:12px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="palco"><div id="slide"><img alt=""></div></div>
<div id="n"></div>
<script src="deck.js"></script>
<script>
// Setas, PageUp/PageDown (passador), Home/End, F = tela cheia. Espaço avança, ou toca/pausa no slide do vídeo.
// Clique no vídeo = play/pause com som. A página fica no endereço (#32).
const slide=document.getElementById('slide'),img=slide.querySelector('img'),n=document.getElementById('n');
const arq=p=>'slides/'+String(p).padStart(2,'0')+'.jpg';
let atual=1,video=null,play=null;
function escala(){slide.style.transform='scale('+Math.min(innerWidth/1280,innerHeight/720)+')'}
function vai(p){
  atual=Math.max(1,Math.min(DECK.paginas,p));
  img.src=arq(atual);
  if(video){video.pause();video.remove();play.remove();video=null}
  const v=DECK.videos[atual];
  if(v){
    video=document.createElement('video');
    // Sem controles nativos: depois do clique neles, o Chrome não repassa as teclas e o passador trava.
    Object.assign(video,{src:v.src,poster:v.poster,playsInline:true,preload:'metadata'});
    Object.assign(video.style,{left:v.x+'px',top:v.y+'px',width:v.w+'px',height:v.h+'px'});
    play=document.createElement('button');play.id='play';play.textContent='▶';play.setAttribute('aria-label','Tocar o vídeo');
    Object.assign(play.style,{left:(v.x+v.w/2)+'px',top:(v.y+v.h/2)+'px'});
    const alterna=()=>{video.paused?video.play():video.pause();play.blur()};
    video.onclick=alterna;play.onclick=alterna;
    video.onplay=()=>play.hidden=true;video.onpause=()=>play.hidden=false;
    slide.append(video,play);
  }
  n.textContent=atual+' / '+DECK.paginas;
  history.replaceState(null,'','#'+atual);
  if(atual<DECK.paginas)new Image().src=arq(atual+1);
}
addEventListener('keydown',e=>{
  if(e.key===' '&&video){e.preventDefault();video.paused?video.play():video.pause();return} // espaço = play/pause no slide do vídeo
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' '].includes(k))vai(atual+1);
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(k))vai(atual-1);
  else if(k==='Home')vai(1);
  else if(k==='End')vai(DECK.paginas);
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else return;
  e.preventDefault();e.stopPropagation();
},true); // captura: senão o vídeo, depois do clique no play, engole as teclas
addEventListener('resize',escala);
escala();
vai(parseInt(location.hash.slice(1))||1);
</script>
</body>
</html>
